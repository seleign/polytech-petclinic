name: PetClinic CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:              # Actions 화면 [Run workflow] 버튼으로 수동 실행

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: user77-webapp
  GITOPS_REPO: ${{ github.repository_owner }}/polytech-gitops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ① 소스 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # ② Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ③ JAR 빌드 (테스트 생략)
      - name: Build JAR with Maven
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

      # ④ AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ⑤ ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ⑥ 이미지 빌드 · Push (--provenance=false : ECR 취약점 스캔 가능)
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA
          docker build --provenance=false -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # ⑦ GitOps 저장소 가져오기 (Token 사용)
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      # ⑧ deployment.yaml의 image를 새 태그로 바꾸고 Push
      - name: Update image tag
        working-directory: gitops
        run: |
          sed -i "s|image: .*|image: $IMAGE|" petclinic/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git commit -am "Deploy petclinic ${GITHUB_SHA::7}"
          git pull --rebase               # 그사이 내가 Push한 Commit이 있어도 반영 후 Push
          git push
